<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>空挺（仮題）</title>
  <link rel="stylesheet" href="css/style.css?v=20260927d">
</head>
<body>
  <div id="game">
    <!-- 背景 -->
    <div id="bg"><div class="fill"></div><div class="pic"></div><span id="bg-label"></span></div>
    <!-- 背景の上に置く画面（タイトル・地図・空挺など） -->
    <div id="stage"></div>
    <!-- 初登場の紹介カット（全身の絵と名前） -->
    <div id="intro" class="hidden"><div class="intro-wrap"><img alt=""><div class="intro-name"></div></div></div>
    <!-- 一枚絵 -->
    <div id="cg"><div class="fill"></div><div class="pic"></div><span id="cg-caption"></span></div>

    <!-- 下のウィンドウ（選択肢・入力・会話） -->
    <div id="bottom">
      <div id="sign" class="signboard hidden"></div>
      <div id="choices" class="window hidden"></div>
      <form id="input-box" class="window hidden">
        <input id="input-field" type="text" maxlength="12" autocomplete="off">
        <button type="submit">決定</button>
      </form>
      <div id="msg" class="window hidden">
        <div id="face" hidden></div>
        <div id="msg-body">
          <div id="speaker"></div>
          <div id="text"></div>
        </div>
        <div id="next-mark">▼</div>
      </div>
    </div>

    <!-- ログ（スレを遡る） -->
    <!-- 右上のボタン（音のオン・オフ、早送り、スレを遡る） -->
    <div id="top-btns">
      <button id="sound-btn" type="button" aria-pressed="true">♪ 音：オン</button>
      <button id="ff-btn" class="hidden" type="button" aria-pressed="false">▶▶ 早送り</button>
      <button id="log-btn" class="hidden" type="button">スレを遡る</button>
    </div>
    <div id="log" class="hidden">
      <div class="log-head">
        <span>スレを遡る</span>
        <button id="log-close" type="button">閉じる</button>
      </div>
      <div id="log-list"></div>
    </div>

    <div id="flash"></div>
    <div id="toast"></div>
  </div>

  <!-- 中身（データ） -->
  <script src="data/characters.js?v=20260927d"></script>
  <script src="data/world.js?v=20260927d"></script>
  <script src="data/scenario.js?v=20260927d"></script>
  <!-- プログラム -->
  <script src="js/state.js?v=20260927d"></script>
  <script src="js/ui.js?v=20260927d"></script>
  <script src="js/engine.js?v=20260927d"></script>
  <script src="js/bgm.js?v=20260927d"></script>
  <script src="js/scenes.js?v=20260927d"></script>
  <script src="js/main.js?v=20260927d"></script>
</body>
</html>
